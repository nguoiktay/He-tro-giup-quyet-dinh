<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký — Hệ Trợ Giúp Quyết Định Tuyển Sinh 2026</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .register-card {
      width: 100%;
      max-width: 440px;
      border: 1px solid #000000;
      background: #ffffff;
      padding: 32px;
      box-shadow: 4px 4px 0px #000000;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      border-bottom: 1px solid #000000;
      padding-bottom: 10px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #555555;
      margin-bottom: 20px;
    }
    .alert-error {
      border: 1px solid #000000;
      background: #f0f0f0;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .field-input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #000000;
      background: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .field-input:focus {
      background: #f9f9f9;
      outline: 1px solid #000000;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      border: 1px solid #000000;
      background: #000000;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.12s ease, color 0.12s ease;
      margin-bottom: 10px;
    }
    .btn:hover {
      background: #ffffff;
      color: #000000;
    }
    .btn-outline {
      background: #ffffff;
      color: #000000;
    }
    .btn-outline:hover {
      background: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="title">Đăng Ký Thí Sinh</div>
    <div class="subtitle">Tạo hồ sơ xét tuyển đại học 2026</div>

    {% if thongBaoLoi %}
      <div class="alert-error">{{ thongBaoLoi }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('dieuKhienXacThuc.trangDangKy') }}">
      <div class="field-group">
        <label class="field-label" for="hoTen">Họ và tên thí sinh:</label>
        <input type="text" id="hoTen" name="hoTen" class="field-input" placeholder="Ví dụ: Nguyễn Văn An" required>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Địa chỉ Email:</label>
        <input type="email" id="email" name="email" class="field-input" placeholder="ten@email.com" required>
      </div>

      <div class="field-group">
        <label class="field-label" for="matKhau">Mật khẩu (ít nhất 8 ký tự):</label>
        <input type="password" id="matKhau" name="matKhau" class="field-input" required>
      </div>

      <button type="submit" class="btn">[ Đăng Ký Tài Khoản ]</button>
      <a href="{{ url_for('dieuKhienKhuyenNghi.trangChonTruong') }}" class="btn btn-outline">[ Trở Về Trang Chọn Trường ]</a>
    </form>
  </div>
</body>
</html>
